name: scraper-therapists (reusable)

# apps/scraper の Stage 2 (--stage=therapists) を実行する共通ワークフロー。
# 単独では起動せず、staging / production それぞれのトリガー用ワークフローから
# `workflow_call` で呼び出される。
#
# Secrets はジョブの `environment:` に紐付いた GitHub Environment から
# 解決される（呼び出し側で inputs.environment に staging / production を渡す）。
on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment 名 (staging | production)'
        type: string
        required: true

# 同じ environment に対して同時実行されないようにする。
# environment が異なれば（=接続先 Supabase が違えば）並走しても問題ない想定だが、
# スクレイピング対象サイトへの負荷を考えると重ねない方が安全なので環境ごとに直列化。
concurrency:
  group: scraper-therapists-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  run:
    name: Sync therapists (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper (--stage=therapists)
        working-directory: apps/scraper
        run: npm run dev:therapists
