name: scraper-availability-notify (production)

# 本番は Vercel Cron からの repository_dispatch で起動 + 手動実行。
#
# 旧: GitHub Actions の `schedule` (`* * * * *`) を直接トリガーにしていたが、
# 毎分起動を保証せず実運用で 5〜15 分の遅延・スキップが頻発したため、
# Vercel Cron 側でスケジュールを管理し、Vercel から GitHub の
# repository_dispatch API を叩いて本ワークフローを起動する構成に変更した。
# Vercel Cron 設定は apps/web/vercel.json、ディスパッチ用 Route Handler は
# apps/web/src/app/api/cron/dispatch-scrape/route.ts を参照。
on:
  workflow_dispatch:
  repository_dispatch:
    types: [availability-production]

jobs:
  run:
    uses: ./.github/workflows/scraper-availability-notify.yml
    with:
      environment: production
    secrets: inherit
