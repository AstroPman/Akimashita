name: scraper-availability-notify (staging)

# ステージング: 30分ごと定期実行 + 手動実行。
# GitHub の schedule は UTC。`*/30 * * * *` は毎時0分・30分。
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  run:
    uses: ./.github/workflows/scraper-availability-notify.yml
    with:
      environment: staging
    secrets: inherit
