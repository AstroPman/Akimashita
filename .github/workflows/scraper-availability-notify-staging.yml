name: scraper-availability-notify (staging)

# ステージング: Vercel Cron からの repository_dispatch で起動 + 手動実行。
# Vercel Cron 側で `*/30 * * * *` を管理し、本ワークフローは
# repository_dispatch を受け取って実行する。
on:
  workflow_dispatch:
  repository_dispatch:
    types: [availability-staging]

jobs:
  run:
    uses: ./.github/workflows/scraper-availability-notify.yml
    with:
      environment: staging
    secrets: inherit
