name: scraper-availability-notify (staging)

# ステージング: 毎時定期実行 + 手動実行。
# GitHub の schedule は UTC。`0 * * * *` は毎時0分（日本時間でも毎時ちょうど）。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  run:
    uses: ./.github/workflows/scraper-availability-notify.yml
    with:
      environment: staging
    secrets: inherit
