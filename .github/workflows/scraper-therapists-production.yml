name: scraper-therapists (production)

# 本番は Vercel Cron からの repository_dispatch で起動 + 手動実行。
# Vercel Cron 側で `0 19 * * 0` (毎週日曜 UTC 19:00 = 月曜 JST 04:00) を管理する。
on:
  workflow_dispatch:
  repository_dispatch:
    types: [therapists-production]

jobs:
  run:
    uses: ./.github/workflows/scraper-therapists.yml
    with:
      environment: production
    secrets: inherit
